name: Update KIPG featured episode

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: write

jobs:
  update-featured:
    runs-on: ubuntu-latest

    steps:
      - name: Check out site
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Find latest completed KIPG episode
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: node scripts/update-youtube-featured.mjs

      - name: Commit updated episode data
        run: |
          if git diff --quiet -- data/latest-kipg-episode.json; then
            echo "No featured-episode change."
            exit 0
          fi

          git config user.name "KIPG Network Bot"
          git config user.email "actions@users.noreply.github.com"

          git add data/latest-kipg-episode.json
          git commit -m "Update latest completed KIPG episode"
          git push
