name: Update KIPG featured episode

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-youtube-featured.yml'
      - 'scripts/*youtube*'
      - 'data/episode-editorial.json'
  schedule:
    - cron: '0 1 * * 4'
      timezone: 'America/New_York'

permissions:
  contents: write
  pages: write

concurrency:
  group: kipg-playlist-sync
  cancel-in-progress: false

jobs:
  update-featured:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out site
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify playlist sync and site files
        run: |
          npm run test:youtube
          npm run verify

      - name: Find latest completed KIPG episode
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: node scripts/update-youtube-featured.mjs

      - name: Commit updated episode data
        run: |
          if git diff --quiet -- data/latest-kipg-episode.json; then
            echo "No featured-episode change."
            exit 0
          fi

          git config user.name "KIPG Network Bot"
          git config user.email "actions@users.noreply.github.com"

          git add data/latest-kipg-episode.json
          git commit -m "Update latest completed KIPG episode"
          git push

      # GITHUB_TOKEN commits do not automatically trigger a Pages build.
      - name: Publish episode data to the existing GitHub Pages site
        uses: actions/github-script@v7
        with:
          script: |
            await github.request('POST /repos/{owner}/{repo}/pages/builds', {
              owner: context.repo.owner,
              repo: context.repo.repo
            });
